<title>副本商行 COPY CO.</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: one landscape screen like an archive — records stream as skewed slices from lower-left (past) to upper-right (future), the current one pulled out in the middle; tiny type in the corners. */
:root{
  --lg:#D2D2D2; --dg:#AAAAAA; --g:#C3FF41; --k:#000000; --white:#FFFFFF;
  --bg:#ECECEC; --card:#F7F7F7; --soft:rgba(0,0,0,.58); --faint:rgba(0,0,0,.34); --line:rgba(0,0,0,.16);
  --f:"Noto Sans TC","PingFang TC","Hiragino Sans","Microsoft JhengHei",sans-serif;
  color-scheme:light;
}
:root[data-bg="white"]{--bg:var(--white);--card:#F2F2F2}
*{box-sizing:border-box}

html,body{height:100%}
body{background:var(--bg);color:var(--k);font-family:var(--f);font-size:13px;line-height:1.6;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;transition:background .3s}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--k);outline-offset:3px}
h1,h2,h3,p{margin:0}
p,li,dd,h4,small,figcaption,.line{text-wrap:pretty;line-break:strict}
.nw{white-space:nowrap}
.soft{color:var(--soft)}
.mk{width:9px;height:9px;display:inline-block;box-shadow:inset 0 0 0 1.4px var(--k);flex:none;vertical-align:-.5px}
.mk.raw{background:var(--k)}
.mk.dec{background:linear-gradient(135deg,var(--k) 50%,transparent 50%)}

/* ---------- 單一橫式畫面 ---------- */
.app{position:relative;height:100%;overflow:hidden}
.stage{position:absolute;inset:0;overflow:hidden;touch-action:pan-y}
.app .ui{transition:opacity .6s}
.app.intro .ui{opacity:0}
.app.intro .ui *{pointer-events:none}
.slice{position:absolute;left:0;top:0;transform-origin:0 0;transition:transform .9s cubic-bezier(.6,0,.2,1),opacity .6s;will-change:transform}
.slice img{display:block;width:100%;height:100%;object-fit:cover;pointer-events:none;user-select:none}
.slice:hover{translate:0 -10px}
.slice.cur:hover{translate:none}
.slice.g{background:var(--g);pointer-events:none}
.slice.m{background:var(--dg);pointer-events:none}
.slice.m.s{background:var(--white);box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.slice.g:hover{translate:none}
.slice.cur::before{content:"";position:absolute;inset:0;background:var(--dg);transform:translate(18px,18px);z-index:-1}
.slice.cur::after{content:"";position:absolute;right:-24px;top:-16px;width:24px;height:16px;background:var(--g)}
@media (prefers-reduced-motion:reduce){.slice{transition:none}}

.ui{position:absolute;z-index:300;pointer-events:none}
.ui > *{pointer-events:auto}
.tl{left:max(28px,env(safe-area-inset-left,0px));top:90px;display:grid;gap:22px;width:min(360px,30vw)}
.tc{left:50%;top:24px;transform:translateX(-50%);text-align:center}
.tr{right:max(28px,env(safe-area-inset-right,0px));top:env(safe-area-inset-top,0px);height:62px;display:flex;gap:26px;align-items:center;z-index:470}
.rm{right:max(28px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-38%);text-align:right;display:grid;gap:2px;justify-items:end}
.br{right:max(28px,env(safe-area-inset-right,0px));bottom:22px;display:grid;gap:8px;justify-items:end;text-align:right}

.clock b{display:inline;font-size:13px;font-weight:700;line-height:1.35}
.clock b+b{margin-left:.7em}
.clock span{display:flex;margin-top:3px}
.clock span{font-size:11px;color:var(--soft);display:inline-flex;gap:6px;align-items:center}
.clock span i{width:6px;height:6px;background:var(--g);display:inline-block;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.clock span i{animation:none}}
.rec{display:grid;gap:6px}
.rec .dh{font-size:10px;letter-spacing:.14em;color:var(--soft);margin-top:-4px}
.rec .id{font-size:11px;color:var(--soft);letter-spacing:.04em}
.rec h1{font-size:20px;font-weight:700;line-height:1.3;letter-spacing:-.01em}
.rec .line{display:flex;gap:8px;align-items:baseline;font-size:12.5px}
.rec .acts{display:flex;gap:16px;margin-top:6px;flex-wrap:wrap}
.lk{font-size:12px;font-weight:500;display:inline-flex;gap:6px;align-items:center;text-decoration:none}
.lk:hover{text-decoration:underline;text-underline-offset:3px}
.lk.add::before{content:"+";display:inline-grid;place-items:center;width:15px;height:15px;background:var(--g);font-size:12px;line-height:1}

.brand{font-weight:900;font-size:14px;letter-spacing:-.01em}
.brand [data-logotype]{font-weight:500;font-size:11px;letter-spacing:.3em;margin-left:8px}
/* 主選單：中文為主、英文為輔，目前所在頁以綠色方塊標示 */
.nv{display:grid;text-decoration:none;color:var(--soft)}
.nv b{font-size:13px;font-weight:500;letter-spacing:.06em;line-height:1.25}
.nv small{font-size:9.5px;letter-spacing:.16em;line-height:1.3}
.nv:hover{color:var(--k)}
.nv[aria-current]{color:var(--k)}
.nv[aria-current] b{font-weight:700}
.nv i{font-style:normal;font-size:10px;font-weight:700;margin-left:4px;padding:0 4px;box-shadow:inset 0 0 0 1px var(--dg)}
#cartBtn.has i{background:var(--g);box-shadow:none}
.rm sup{font-size:9px;font-weight:500;margin-left:2px}

.rm .st{font-size:12.5px;color:var(--faint);font-weight:500;line-height:1.75;display:inline-flex;align-items:baseline}
.rm .st:hover{color:var(--k)}
.rm .st.on{color:var(--k);font-weight:700}
.rm .st.on::before{content:"";width:7px;height:7px;background:var(--g);margin-right:8px;align-self:center}
.rm .prods{display:grid;gap:0;margin:2px 0 8px;justify-items:end}
.rm .prods a{font-size:11.5px;color:var(--soft);text-decoration:none;line-height:1.7}
.rm .prods a:hover,.rm .prods a.on{color:var(--k);text-decoration:underline;text-underline-offset:3px}
.rm .sep{height:10px}

.br .tag{font-size:11px;font-weight:700;letter-spacing:.06em}
.br .fic{font-size:10.5px;color:var(--soft)}
.nav{display:flex;gap:14px;align-items:center;font-size:12px}
.nav button{width:26px;height:26px;display:grid;place-items:center;box-shadow:inset 0 0 0 1px var(--line)}
.nav button:hover{background:var(--k);color:var(--white)}

/* ---------- 側邊面板 ---------- */
.panel{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--card);z-index:500;transform:translateX(102%);transition:transform .55s cubic-bezier(.6,0,.2,1);display:flex;flex-direction:column;box-shadow:-1px 0 0 var(--line)}
.panel.open{transform:none}
/* 面板開啟時：背景蓋一層，滑鼠與鍵盤只操作面板 */
.scrim{position:fixed;inset:0;z-index:465;background:rgba(236,236,236,.55);opacity:0;pointer-events:none;transition:opacity .5s}
.scrim.on{opacity:1;pointer-events:auto}
.p-body{overscroll-behavior:contain}
.p-body.anim > *:not(.feed):not(.printer):not(.after-print){animation:pin .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i) * 70ms)}
@keyframes pin{from{opacity:0;transform:translateX(32px)}}
.p-body.anim .cline{animation:pin .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--j) * 80ms + 120ms)}
/* 結帳處理中：訂單項目被抽走，方塊條逐格填滿 */
#coForm.proc .box{transition:transform .5s cubic-bezier(.6,0,.2,1),opacity .4s;transform:translateY(-14px);opacity:.25}
#coForm.proc .box:nth-child(2){transition-delay:.08s}#coForm.proc .box:nth-child(3){transition-delay:.16s}#coForm.proc .box:nth-child(4){transition-delay:.24s}
.prog{display:none;gap:4px;margin-top:6px}
#coForm.proc .prog{display:flex}
.prog i{width:14px;height:14px;background:var(--lg);animation:pfill .12s linear both;animation-delay:calc(var(--k) * 80ms)}
@keyframes pfill{to{background:var(--g)}}
.printer{animation:pdrop .55s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes pdrop{from{transform:translateY(-60px);opacity:0}}
/* 收據上的黑白商品方塊 */
.rc-sq{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 8px;margin:4px 0 2px}
.rc-sq figure{margin:0;display:grid;gap:3px}
.rc-sq canvas{width:100%;aspect-ratio:1;image-rendering:pixelated;display:block;background:#fff}
.rc-sq figcaption{font-size:9.5px;letter-spacing:.06em;text-align:center}
@media (prefers-reduced-motion:reduce){.p-body.anim > *,.p-body.anim .cline,.printer,.prog i{animation:none}}
@media (prefers-reduced-motion:reduce){.panel{transition:none}}
.p-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:22px 28px 14px;padding-right:max(28px,env(safe-area-inset-right,0px));font-size:11px;color:var(--soft);letter-spacing:.06em}
.p-head button{font-size:12px;color:var(--k);font-weight:500}
.p-head button:hover{text-decoration:underline}
.p-body{flex:1;overflow:auto;padding:4px 28px 40px;padding-right:max(28px,env(safe-area-inset-right,0px));display:grid;gap:28px;align-content:start}
.p-body h2{font-size:26px;font-weight:700;line-height:1.3;letter-spacing:-.01em}
.p-body h3{font-size:15px;font-weight:700}
.p-body p{font-size:13.5px}
.en{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs button{width:64px;height:64px;position:relative}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs button.on::after{content:"";position:absolute;right:-5px;top:-5px;width:9px;height:9px;background:var(--g)}
.thumbs small{display:block;font-size:10px;color:var(--soft);margin-top:2px}
dl.spec{display:grid;grid-template-columns:auto 1fr;margin:0;border-top:1px solid var(--line)}
dl.spec dt,dl.spec dd{margin:0;padding:9px 0;border-bottom:1px solid var(--line)}
dl.spec dt{font-size:11.5px;color:var(--soft);padding-right:22px}
dl.spec dd{font-size:13px}
.buy{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.price{font-size:26px;font-weight:700;line-height:1}
.price small{font-size:10.5px;font-weight:400;color:var(--soft);margin-left:6px}
.btn{display:inline-flex;align-items:center;gap:10px;background:var(--g);color:var(--k);padding:12px 20px;font-size:12.5px;font-weight:500;letter-spacing:.1em;text-decoration:none}
.btn:hover{background:var(--k);color:var(--g)}
.btn.line{background:transparent;box-shadow:inset 0 0 0 1px var(--k)}
.btn.line:hover{background:var(--k);color:var(--white)}
.note{font-size:13px;padding-left:12px;box-shadow:inset 2px 0 0 var(--g)}
.flip{perspective:1600px}
.flip-in{display:grid;transition:transform .8s cubic-bezier(.6,0,.2,1);transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;gap:16px;align-content:start;background:transparent}
.flip.on .front,.flip:not(.on) .back{visibility:hidden;transition:visibility 0s .4s}
.face.back{transform:rotateY(180deg)}
@media (prefers-reduced-motion:reduce){.flip-in{transition:none}}
.tabs{display:flex;gap:4px 16px;flex-wrap:wrap}
.tab{font-size:12px;display:inline-flex;align-items:center;gap:6px;padding:2px 0}
.tab::before{content:"";width:7px;height:7px;box-shadow:inset 0 0 0 1px var(--dg)}
.tab.on::before{background:var(--g);box-shadow:none}
.tab:hover{text-decoration:underline;text-underline-offset:3px}
ul.recs{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
ul.recs li{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.conf{display:inline-flex;gap:3px;align-items:center;font-size:11px;white-space:nowrap;color:var(--soft)}
.conf i{width:7px;height:7px;box-shadow:inset 0 0 0 1px var(--k);display:inline-block}
.conf i.f{background:var(--k)}

.cline{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.cline img{width:56px;height:56px;object-fit:cover;display:block}
.cline small{display:block;font-size:11px;color:var(--soft)}
.cline a{font-weight:500;text-decoration:none}
.qty{display:flex;align-items:center;box-shadow:inset 0 0 0 1px var(--line)}
.qty button{width:28px;height:26px}
.qty button:hover{background:var(--g)}
.qty span{min-width:22px;text-align:center;font-size:12px}
.cright{display:grid;justify-items:end;gap:6px;font-size:13px}
.rmv{font-size:11px;color:var(--soft);text-decoration:underline}
.sum{display:grid;gap:4px}
.sum-row{display:flex;justify-content:space-between;gap:12px;font-size:13px}
.sum-row.deal{color:var(--k)}.sum-row.deal span:first-child{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}.sum-row.deal span:first-child{color:var(--soft);font-size:12px}
.sum-row em,.deal-next em,.deal-tag em{font-style:normal;background:var(--g);color:var(--k);font-size:11.5px;font-weight:700;padding:2px 7px;letter-spacing:.04em;margin-right:8px;white-space:nowrap}
.sum-row.tot s{color:var(--soft);font-weight:400;font-size:13px;margin-right:10px}
.deal-next{display:grid;gap:8px;padding:12px 14px;border:1px dashed var(--soft);font-size:13px}.deal-next .lk{margin-left:6px}
.deal-tag{display:grid;gap:12px;font-size:13px;padding-top:4px}.deal-tag p{margin:0;display:grid;gap:5px}.deal-tag em{justify-self:start}.deal-tag small{display:block;color:var(--soft);font-size:11.5px;margin-top:3px}
.sum-row.tot{font-size:16px;font-weight:700;border-top:1px solid var(--k);padding-top:10px;margin-top:4px}
.cov{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:11.5px}
.cov span{display:inline-flex;align-items:center;gap:6px;color:var(--faint)}
.cov span::before{content:"";width:7px;height:7px;box-shadow:inset 0 0 0 1px var(--dg)}
.cov span.on{color:var(--k)}
.cov span.on::before{background:var(--g);box-shadow:none}
.combo div{padding:10px 0;border-bottom:1px solid var(--line);display:grid;gap:3px;font-size:13px}
.combo{border-top:1px solid var(--line)}
.combo small{font-size:10.5px;color:var(--soft);letter-spacing:.08em}
.box{display:grid;gap:8px;padding:16px 0;border-top:1px solid var(--line)}
.box label{display:flex;gap:10px;align-items:flex-start;font-size:13px}
.box input{width:17px;height:17px;margin-top:3px;accent-color:var(--k)}
.receipt{background:var(--white);padding:28px 24px 32px;font-size:12px;line-height:1.7;-webkit-mask:radial-gradient(circle at 8px 100%,transparent 6px,#000 6.5px) 0 0/16px 100% repeat-x;mask:radial-gradient(circle at 8px 100%,transparent 6px,#000 6.5px) 0 0/16px 100% repeat-x}
/* 收據印表機：紙從出紙口一格一格送出，最後被撕下 */
.printer{position:relative;z-index:2;height:44px;background:#000;display:flex;align-items:center;gap:10px;padding:0 16px;margin:0 -6px}
.printer .led{width:7px;height:7px;background:var(--g);animation:led .32s steps(2) 8}
.printer .pn{font-size:10px;letter-spacing:.18em;color:var(--dg)}
.printer .slit{position:absolute;left:18px;right:18px;bottom:6px;height:3px;background:#333}
@keyframes led{50%{opacity:.15}}
.feed{display:grid;grid-template-rows:0fr;margin-top:-9px;animation:feed 3.2s steps(30,end) .45s forwards}
.feed>div{min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
@keyframes feed{to{grid-template-rows:1fr}}
.feed .receipt{animation:tear .5s cubic-bezier(.3,1.6,.5,1) 3.8s both}
@keyframes tear{0%{transform:none}35%{transform:translateY(5px) rotate(-.8deg)}100%{transform:translateY(12px) rotate(.4deg)}}
.after-print{animation:fadeup .6s ease 4.2s both}
@keyframes fadeup{from{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion:reduce){.feed{animation:none;grid-template-rows:1fr}.feed .receipt,.after-print,.printer .led{animation:none}}
.receipt .c{text-align:center}
.receipt .big{font-weight:900;font-size:26px;line-height:1.1}
.receipt hr{border:0;border-top:1px dashed var(--dg);margin:12px 0}
.receipt .r{display:flex;justify-content:space-between;gap:10px}
.receipt .t{font-size:10.5px;letter-spacing:.1em;color:var(--soft)}
.receipt .hl{background:var(--g);padding:0 6px}
.barcode{height:36px;margin-top:12px;background:repeating-linear-gradient(90deg,var(--k) 0 2px,transparent 2px 4px,var(--k) 4px 5px,transparent 5px 8px,var(--k) 8px 11px,transparent 11px 12px)}
.flow{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:0;padding:0;font-size:12px}
.flow li{background:var(--bg);padding:3px 10px}
.flow li.arr{background:none;padding:0;color:var(--soft)}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,180%);background:var(--k);color:var(--white);font-size:12px;letter-spacing:.06em;padding:10px 16px;z-index:600;transition:transform .35s;display:flex;gap:10px;align-items:center;max-width:calc(100% - 32px)}
.toast i{width:8px;height:8px;background:var(--g);flex:none}
.toast.show{transform:translate(-50%,0)}
.toast{white-space:nowrap;max-width:calc(100vw - 32px)}.toast span{overflow:hidden;text-overflow:ellipsis}

/* ---------- 點・條・面・副本 ---------- */
.formation{position:fixed;inset:0;z-index:450;background:var(--bg);overflow:hidden}
.formation canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.f-ui{position:absolute;z-index:2}
.f-tl{left:max(28px,env(safe-area-inset-left,0px));top:90px;width:min(330px,calc(100% - 56px));display:grid;gap:10px}
.f-tl .seq{font-size:11px;letter-spacing:.12em;color:var(--soft);white-space:nowrap;width:max-content}
@media (max-width:520px){.f-tl .seq{font-size:clamp(7px,2.1vw,11px);letter-spacing:.06em}}
.f-tl h2{font-size:30px;font-weight:700;line-height:1.2;letter-spacing:-.01em;margin-top:14px}
.f-tl h2 small{font-size:12px;font-weight:500;letter-spacing:.16em;margin-left:10px}
.f-tl p{font-size:13.5px}
#fText{display:grid;gap:1px;line-height:1.75}
#fTitle,#fText{transition:opacity .38s ease,transform .38s ease}
#fTitle.out,#fText.out{opacity:0;transform:translateY(-6px)}
#fTitle.in{animation:ftin .6s cubic-bezier(.2,.8,.2,1) both}
#fText.in span{animation:ftin .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(.12s + var(--i) * .16s)}
@keyframes ftin{from{opacity:0;transform:translateY(10px)}}
@media (prefers-reduced-motion:reduce){#fTitle.in,#fText.in span{animation:none}}
#fText span{white-space:nowrap}
.f-tl .cnt{font-size:12px;font-weight:700;display:inline-flex;gap:8px;align-items:center}
.f-tl .cnt::before{content:"";width:8px;height:8px;background:var(--g)}
.f-tc{left:50%;top:24px;transform:translateX(-50%)}
.f-tr{right:max(28px,env(safe-area-inset-right,0px));top:24px;font-size:12px;font-weight:500;display:none}
@media (max-width:820px){.f-tr{display:block}}
.f-bar{left:max(28px,env(safe-area-inset-left,0px));right:max(28px,env(safe-area-inset-right,0px));bottom:22px;display:flex;justify-content:space-between;align-items:end;gap:14px;flex-wrap:wrap}
.f-steps{display:flex;gap:4px 22px;flex-wrap:wrap}
.f-steps button{font-size:12.5px;font-weight:500;display:inline-flex;gap:8px;align-items:center;color:var(--faint)}
.f-steps button::before{content:"";width:8px;height:8px;box-shadow:inset 0 0 0 1px var(--dg)}
.f-steps button.on{color:var(--k)}
.f-steps button.on::before{background:var(--g);box-shadow:none}
.f-steps button:hover{color:var(--k)}
.f-acts{display:flex;gap:20px;align-items:center}
.f-acts button{font-size:12px;font-weight:500}
.f-acts button:hover{text-decoration:underline;text-underline-offset:3px}
@media (max-width:820px){.f-tc{display:none}.f-tl h2{font-size:24px}}

/* ---------- 標準字 ---------- */
.logo{left:max(28px,env(safe-area-inset-left,0px));top:env(safe-area-inset-top,0px);height:62px;z-index:470;display:flex;align-items:center;line-height:0}
.logo img{height:34px;width:auto;display:block}
/* ---------- 品牌理念：全螢幕、可捲動、每段一張會動的圖表 ---------- */

  .tree{min-height:0}.t-rows{grid-template-rows:none}.t-rows li{gap:4px 12px}}
@media (max-width:620px){.pipe .lb{font-size:10px;width:64px;margin-left:-32px}.pipe .lb.s0{margin-left:0}.pipe .lb.sN{margin-left:-64px}.pipe .ph{font-size:9px;letter-spacing:.04em}.pipe .ph:last-of-type{top:188px}
  .rg-r{grid-template-columns:1fr auto auto;gap:10px}.toast{font-size:11px;padding:9px 12px}}

/* 3. 四間店：每格 = 50 筆紀錄 */

function figSVG(key,cls=""){
  const P0=POSE[key]||POSE.stand,rad=d=>d*Math.PI/180,v=(p,a,len)=>[p[0]+Math.sin(rad(a))*len,p[1]+Math.cos(rad(a))*len];
  const H=[30,56],N=v(H,180+P0.l,25),per=rad(P0.l);const off=(p,dx)=>[p[0]+Math.cos(per)*dx,p[1]+Math.sin(per)*dx];
  const sL=off(v(N,P0.l,3),-7),sR=off(v(N,P0.l,3),7),hL=[H[0]-4.5,H[1]],hR=[H[0]+4.5,H[1]],hd=v(N,180+P0.l+(P0.h||0),7.5);
  const eL=v(sL,P0.a[0][0],14),wL=v(eL,P0.a[0][1],13),eR=v(sR,P0.a[1][0],14),wR=v(eR,P0.a[1][1],13);
  const kL=v(hL,P0.g[0][0],19),aL=v(kL,P0.g[0][1],19),kR=v(hR,P0.g[1][0],19),aR=v(kR,P0.g[1][1],19);
  const pts=[hd,sL,sR,eL,wL,eR,wR,kL,aL,kR,aR,hL,hR];let mny=Math.min(...pts.map(p=>p[1]))-6.5,mxy=Math.max(...pts.map(p=>p[1]))+1.8,mnx=Math.min(...pts.map(p=>p[0]))-4,mxx=Math.max(...pts.map(p=>p[0]))+4;
  const dx=30-(mnx+mxx)/2,dy=96-mxy,T=p=>`${(p[0]+dx).toFixed(1)} ${(p[1]+dy).toFixed(1)}`;
  const L=(a,b,w)=>`<path d="M${T(a)}L${T(b)}" stroke-width="${w}"/>`;
  const limbs=[[sL,eL,4.6],[eL,wL,4],[sR,eR,4.6],[eR,wR,4],[hL,kL,6],[kL,aL,5],[hR,kR,6],[kR,aR,5]];
  const torso=`<path d="M${T(sL)}L${T(sR)}L${T(hR)}L${T(hL)}Z" stroke-width="5" stroke-linejoin="round"/>`;
  const body=limbs.map(([a,b,w])=>L(a,b,w)).join("")+torso+`<path d="M${T(N)}L${T(v(N,180+P0.l,2))}" stroke-width="3.6"/>`;

      <p>美國聯邦貿易委員會（FTC）調查了九家資料仲介商。他們不直接向消費者蒐集資料，而是從政府、公開資訊與商業來源買進零散紀錄，比對成一份份個人檔案，推論出興趣與狀態、貼上分群標籤，再包裝成產品，賣給各行各業的買家。副本商行把這條看不見的生產線，做成一盒盒掛在牆上的商品。</p></div>

const FSEG=["足球媽媽","科技愛好者","品牌忠誠","折扣購物者","準父母","露營用品潛在買家","可能申請退款者","高端購物者","糖尿病關注","狗主人"];
const FCL=[["零售業者",0],["製藥公司",0],["非營利・政治團體",0],["其他資料仲介商",0],["金融借貸",1],["保險公司",1],["政府機關",1],["一般個人",2]];
const FPROD=[["行銷產品",.46],["風險控管",.42],["人物搜尋",.12]];
let FL=null;
function flowInit(cv){

  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);const x=cv.getContext("2d");x.setTransform(dpr,0,0,dpr,0,0);
  const narrow=W<760,Lm=narrow?70:104,Rm=narrow?104:132,U=W-Lm-Rm,X=[0,.26,.5,.76,1].map(f=>Lm+U*f),cy=H*.56;
  const c=Math.max(6,Math.min(12,Math.round(W/120)));
  FL={cv,x,W,H,X,cy,c,narrow,lanes:[cy-100,cy,cy+100],bins:[cy-92,cy,cy+92],cl:FCL.map((v,i)=>[v[0],v[1],cy-161+i*46]),
    dots:[],pros:[],cps:[],ad:0,ap:0,t:0,on:false,last:0,raf:0,binN:[0,0,0],rnd:rng(99)};
  for(let i=0;i<360;i++)flowStep(1/30);
  flowDraw();
}
function flowStep(dt){const F=FL,r=F.rnd;F.t+=dt;
  F.ad+=dt*7;while(F.ad>=1){F.ad--;F.dots.push({l:Math.floor(r()*3),j:(r()-.5)*56,s:F.t,dur:3+r()*.7})}
  F.ap+=dt*1.15;while(F.ap>=1){F.ap--;const u=r();const pr=u<.46?0:u<.88?1:2;
    F.pros.push({s:F.t,cols:Array.from({length:4+Math.floor(r()*3)},()=>Math.floor(r()*3)),seg:FSEG[Math.floor(r()*FSEG.length)],pr,yj:(r()-.5)*30})}
  F.dots=F.dots.filter(d=>F.t-d.s<d.dur);

function flowDraw(){const F=FL,x=F.x,{W,H,X,cy,c}=F,COL=["#AAAAAA","#FFFFFF","#C3FF41"];

  x.font=`500 ${F.narrow?10:11}px "Noto Sans TC",sans-serif`;x.textAlign="center";
  ST.forEach(([n,zh,en],i)=>{x.strokeStyle="rgba(0,0,0,.14)";x.setLineDash([3,4]);x.beginPath();x.moveTo(X[i],52);x.lineTo(X[i],H-28);x.stroke();x.setLineDash([]);
    x.fillStyle="rgba(0,0,0,.58)";x.fillText(n,X[i],14);x.fillStyle="#000";x.font=`700 ${F.narrow?11:13}px "Noto Sans TC",sans-serif`;if(F.narrow&&zh.length>2){x.fillText(zh.slice(0,2),X[i],29);x.fillText(zh.slice(2),X[i],43)}else x.fillText(zh,X[i],31);
    if(!F.narrow){x.font=`500 9px "Noto Sans TC",sans-serif`;x.fillStyle="rgba(0,0,0,.5)";x.fillText(en,X[i],44)}x.font=`500 ${F.narrow?10:11}px "Noto Sans TC",sans-serif`});
  /* 來源 */
  x.textAlign="right";["政府資料","公開資訊","商業來源"].forEach((t,i)=>{const y=F.lanes[i];x.fillStyle="#000";x.fillText(t,X[0]-26,y+4);

  x.textAlign="left";x.setLineDash([3,3]);x.strokeStyle="#000";x.strokeRect(10,H-30,18,18);x.setLineDash([]);x.fillStyle="#000";x.fillText("當事人",34,H-21);x.fillStyle="rgba(0,0,0,.5)";x.fillText("不在流程中",34,H-8);
  /* 產品箱 */
  F.bins.forEach((y,i)=>{const bw=c*4.6,bh=c*3,p=F.binN[i];x.fillStyle=p>0?`rgba(195,255,65,${.25+p*.5})`:"rgba(255,255,255,.6)";x.fillRect(X[3]-bw/2,y-bh/2,bw,bh);
    x.strokeStyle="#000";x.lineWidth=1;x.strokeRect(X[3]-bw/2+.5,y-bh/2+.5,bw-1,bh-1);x.fillStyle="#000";x.textAlign="center";x.fillText(FPROD[i][0],X[3],y+bh/2+14)});
  /* 買家 */
  x.textAlign="left";if(F.narrow)x.font=`500 9.5px "Noto Sans TC",sans-serif`;F.cl.forEach(([t,,y])=>{x.fillStyle="#000";x.fillRect(X[4]+10,y-4,8,8);x.fillText(t,X[4]+24,y+4)});
  /* 原始紀錄：從三種來源流入，在比對站被吸收 */
  F.dots.forEach(d=>{const u=(F.t-d.s)/d.dur,ly=F.lanes[d.l];let px,py;

    else{const v=sm((u-.5)/.5);px=lerp(X[0]+(X[1]-X[0])*.35,X[1]-c*3,v);py=lerp(ly*.6+cy*.4+d.j*.6,cy+d.j*.15,v)}
    const s=c*.7,al=Math.min(1,u*6)*(1-sm((u-.88)/.12));x.globalAlpha=al;x.fillStyle=COL[d.l];x.fillRect(px-s/2,py-s/2,s,s);if(d.l===1){x.strokeStyle="#AAAAAA";x.strokeRect(px-s/2+.5,py-s/2+.5,s-1,s-1)}});

      FM.hp.forEach(p=>{if(p.node<0)return;const nd=FM.nodes[p.node],gr=FM.graphs[nd.g],gd=gr.dl;
        if(t<gd){nd.u=-1;nd.ox=nd.oy=nd.vx=nd.vy=0;return}
        const u=1-Math.pow(1-Math.min(1,(t-gd)/1.2),3),fl=E((t-gd-1)/1.5);
        const sx=Math.round((hcx+(p.X*cs+p.Z*sn)*S)/gsz)*gsz+s1/2,sy=Math.round((hty+p.Y*S)/gsz)*gsz+s1/2;
        /* 每個群組的錨點緩慢漂移，讓群組之間的連線鬆緊不斷變化 */
        nd.bx=lerp(sx,nd.x,u)+(Math.sin(t*.42+gr.ph)*14+Math.sin(t*.7+nd.ph)*3)*fl;
        nd.by=lerp(sy,nd.y,u)+(Math.cos(t*.37+gr.ph*1.3)*11+Math.cos(t*.6+nd.ph)*3)*fl;nd.u=u;
        const shv=Math.max(0,Math.min(1,((p.nx*cs+p.nz*sn)*LX+(-p.nx*sn+p.nz*cs)*LZ+.2)/1.05));nd.from=palRGB(Math.round(shv*23))});
      const pos=n=>n<0?[hub.cx,hub.cy]:[FM.nodes[n].bx+FM.nodes[n].ox,FM.nodes[n].by+FM.nodes[n].oy];
      const live=n=>n<0?hub.u>0:FM.nodes[n].u>=0;
      /* 彈簧：連線比原本的距離短，節點被彼此拉扯，同時被自己的錨點拉回 */
      FM.nodes.forEach(nd=>{if(nd.u<0)return;nd.fx=-nd.ox*4;nd.fy=-nd.oy*4});
      FM.edges.forEach(e=>{const ty=e[3],gA=e[0]<0?FM.graphs[e[2]]:FM.graphs[FM.nodes[e[0]].g],gB=FM.graphs[FM.nodes[e[1]].g];
        e.pe=!live(e[0])||!live(e[1])?0:ty==="i"?E((t-gA.dl-.8)/.7):ty==="h"?E((t-gB.dl-.05)/1):E((t-Math.max(gA.dl,gB.dl)-1.3)/1.1);
        if(e.pe<=0)return;const[ax,ay]=pos(e[0]),[bx,by]=pos(e[1]),dx=bx-ax,dy=by-ay,L=Math.hypot(dx,dy)||1;
        const f=(L-e[5])*(ty==="i"?.8:ty==="x"?1.5:.7)*e.pe*Math.min(e[0]<0?1:FM.nodes[e[0]].u,FM.nodes[e[1]].u),fx=dx/L*f,fy=dy/L*f;
        if(e[0]>=0){FM.nodes[e[0]].fx+=fx;FM.nodes[e[0]].fy+=fy}FM.nodes[e[1]].fx-=fx;FM.nodes[e[1]].fy-=fy});
      FM.nodes.forEach(nd=>{if(nd.u<0)return;nd.vx=(nd.vx+nd.fx*dt)*.9;nd.vy=(nd.vy+nd.fy*dt)*.9;nd.ox+=nd.vx*dt;nd.oy+=nd.vy*dt;
        const m=Math.hypot(nd.ox,nd.oy);if(m>46){nd.ox*=46/m;nd.oy*=46/m}nd.cx=nd.bx+nd.ox;nd.cy=nd.by+nd.oy});
      /* 連線：群組內實線；群組之間、與中心之間用會微微擺動、被拉緊的弧線 */
      x.strokeStyle="#0087FF";
      FM.edges.forEach(e=>{if(!(e.pe>0))return;const ty=e[3],[ax,ay]=pos(e[0]),[bx,by]=pos(e[1]);
        x.globalAlpha=(ty==="i"?.85:ty==="x"?.6:.42)*fo;x.lineWidth=ty==="i"?1:ty==="x"?.9:.8;x.beginPath();x.moveTo(ax,ay);
        if(ty==="i"){x.lineTo(lerp(ax,bx,e.pe),lerp(ay,by,e.pe))}
        else{const L=Math.hypot(bx-ax,by-ay)||1,sg=(6+L*.05)*Math.sin(t*.9+e[4])*(1-.6*Math.min(1,Math.max(0,(L-e[5])/Math.max(1,e[5])))),
          cx0=(ax+bx)/2-(by-ay)/L*sg,cy0=(ay+by)/2+(bx-ax)/L*sg,u=e.pe,qx=lerp(ax,cx0,u),qy=lerp(ay,cy0,u),ex=lerp(qx,lerp(cx0,bx,u),u),ey=lerp(qy,lerp(cy0,by,u),u);
          x.quadraticCurveTo(qx,qy,ex,ey)}
        x.stroke()});
      FM.nodes.forEach(nd=>{if(!(nd.u>=0))return;const sz=lerp(s1,nd.sz,nd.u),to=nd.k==="g"?RGB.G:nd.k==="k"?RGB.K:RGB.A;x.globalAlpha=fo;x.fillStyle=mix(nd.from,to,nd.u);x.fillRect(nd.cx-sz/2,nd.cy-sz/2,sz,sz)});
      if(hub.u>0){const hs=gsz*2.4*hub.u;x.globalAlpha=fo;x.fillStyle="#000";x.fillRect(hub.cx-hs/2-2,hub.cy-hs/2-2,hs+4,hs+4);x.fillStyle=G;x.fillRect(hub.cx-hs/2,hub.cy-hs/2,hs,hs);
        x.globalAlpha=hub.u*fo;x.fillStyle="#000";x.font=`700 12px "Noto Sans TC",sans-serif`;x.fillText("樣本 07",hub.cx+hs/2+8,hub.cy+4)}
      x.font=`500 10px "Noto Sans TC",sans-serif`;x.fillStyle="rgba(0,0,0,.62)";
      FM.nodes.forEach(nd=>{if(!nd.lab||!(nd.u>=0))return;const la=E((t-FM.graphs[nd.g].dl-1.2)/.5);if(la<=0)return;x.globalAlpha=la*fo;x.fillText(nd.lab,nd.cx+nd.sz/2+5,nd.cy+3)});
    }
    FM.lastNow=now;
  }
  x.restore();
  x.globalAlpha=1;
  const st=t<FST[1]?0:t<FST[2]?1:2;
  if(st!==FM.stage){const first=FM.stage<0;FM.stage=st;fText(st,first);
    document.querySelectorAll("#fSteps button").forEach((b,i)=>b.classList.toggle("on",i===st))}
  $("fCnt").textContent=t<3.2?`${n} 筆數位事件`:t<5.2?`依時間串聯・挑選・解讀`:t<11.8?`1 位人物副本`:`同一規格・${P.length} 件上架`;
  FM.raf=requestAnimationFrame(fDraw);
}
/* 說明文字：舊的先淡出上移，新的逐行淡入 */
function fText(st,now){const [zh,en,tx]=FTXT[st],T=$("fTitle"),P=$("fText");clearTimeout(fText.t);
  const put=()=>{T.innerHTML=`${zh}<small>${en}</small>`;P.innerHTML=tx.split("|").map((l,i)=>`<span style="--i:${i}">${l}</span>`).join("");
    [T,P].forEach(el=>{el.classList.remove("in");void el.offsetWidth;el.classList.add("in")})};
  if(now||RMf){put();return}T.classList.add("out");P.classList.add("out");fText.t=setTimeout(()=>{T.classList.remove("out");P.classList.remove("out");put()},380)}
function fStart(t=0){clearTimeout(FM.outT);FM.out=0;const fm=$("formation");fm.style.transition="";fm.style.opacity="";fBuild();FM.stage=-1;FM.t0=performance.now()-unwarp(RMf&&t===0?17:t)*1000;cancelAnimationFrame(FM.raf);FM.raf=requestAnimationFrame(fDraw)}
function fStop(){cancelAnimationFrame(FM.raf)}
window.addEventListener("resize",()=>{if(!$("formation").hidden){const t=(performance.now()-FM.t0);fBuild();FM.t0=performance.now()-t}});
document.addEventListener("click",e=>{
  const s=e.target.closest("[data-fstep]");if(s){const i=+s.dataset.fstep;FM.stage=-1;FM.t0=performance.now()-unwarp(RMf?[.8,4.7,17][i]:[0,3.3,5.1][i])*1000;return}
  if(e.target.closest("[data-freplay]")){FM.stage=-1;FM.t0=performance.now()-unwarp(RMf?30:0)*1000}
});

layout();info();stores();render();
